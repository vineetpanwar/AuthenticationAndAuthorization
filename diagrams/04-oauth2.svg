<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">OAuth 2.0 Authorization Code Flow</text>

  <defs>
    <marker id="oBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="oGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="oOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <marker id="oRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
    <marker id="oPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7B1FA2"/>
    </marker>
  </defs>

  <!-- Actor Boxes -->
  <!-- User -->
  <rect x="30" y="60" width="140" height="65" rx="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="100" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B1FA2">User</text>
  <text x="100" y="108" text-anchor="middle" font-size="10" fill="#555">(Resource Owner)</text>

  <!-- Client App -->
  <rect x="30" y="220" width="140" height="65" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="100" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Client App</text>
  <text x="100" y="268" text-anchor="middle" font-size="10" fill="#555">(Your Application)</text>

  <!-- Auth Server -->
  <rect x="440" y="60" width="170" height="65" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="525" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">Auth Server</text>
  <text x="525" y="105" text-anchor="middle" font-size="10" fill="#555">(Google, GitHub, etc.)</text>

  <!-- Resource Server -->
  <rect x="440" y="220" width="170" height="65" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="525" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Resource Server</text>
  <text x="525" y="268" text-anchor="middle" font-size="10" fill="#555">(Protected API)</text>

  <!-- Step 1: User clicks Login -->
  <line x1="100" y1="125" x2="100" y2="215" stroke="#7B1FA2" stroke-width="2" marker-end="url(#oPurple)"/>
  <rect x="110" y="148" width="200" height="22" rx="5" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <circle cx="122" cy="159" r="9" fill="#7B1FA2"/>
  <text x="122" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
  <text x="218" y="163" text-anchor="middle" font-size="10" fill="#555">Click "Login with Google"</text>

  <!-- Step 2: Redirect to Auth Server -->
  <path d="M 170 235 Q 300 170 435 90" fill="none" stroke="#1565C0" stroke-width="2" marker-end="url(#oBlue)"/>
  <rect x="215" y="165" width="215" height="22" rx="5" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <circle cx="227" cy="176" r="9" fill="#1565C0"/>
  <text x="227" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
  <text x="330" y="180" text-anchor="middle" font-size="10" fill="#555">Redirect to Auth Server</text>

  <!-- Step 3: User authenticates -->
  <line x1="170" y1="80" x2="435" y2="80" stroke="#7B1FA2" stroke-width="2" marker-end="url(#oOrange)"/>
  <rect x="210" y="55" width="195" height="22" rx="5" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <circle cx="222" cy="66" r="9" fill="#7B1FA2"/>
  <text x="222" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
  <text x="315" y="70" text-anchor="middle" font-size="10" fill="#555">User authenticates</text>

  <!-- Step 4: Redirect back with auth code -->
  <path d="M 440 105 Q 300 200 170 250" fill="none" stroke="#E65100" stroke-width="2" marker-end="url(#oBlue)"/>
  <rect x="222" y="200" width="240" height="22" rx="5" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <circle cx="234" cy="211" r="9" fill="#E65100"/>
  <text x="234" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">4</text>
  <text x="352" y="215" text-anchor="middle" font-size="10" fill="#555">Redirect with authorization code</text>

  <!-- Step 5: Exchange code for tokens (server-to-server) -->
  <rect x="170" y="310" width="280" height="45" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="310" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">Server-to-Server (Back Channel)</text>

  <line x1="170" y1="270" x2="240" y2="310" stroke="#C62828" stroke-width="1.5" stroke-dasharray="4,2"/>

  <line x1="310" y1="320" x2="440" y2="140" stroke="#C62828" stroke-width="2" marker-end="url(#oRed)" stroke-dasharray="6,3"/>
  <circle cx="200" cy="325" r="9" fill="#C62828"/>
  <text x="200" y="329" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5</text>
  <text x="250" y="348" text-anchor="middle" font-size="10" fill="#C62828">Exchange code + client_secret</text>

  <!-- Step 6: Return access token -->
  <line x1="440" y1="115" x2="310" y2="310" stroke="#E65100" stroke-width="2" marker-end="url(#oRed)" stroke-dasharray="6,3"/>
  <circle cx="410" cy="168" r="9" fill="#E65100"/>
  <text x="410" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">6</text>
  <text x="410" y="195" text-anchor="middle" font-size="10" fill="#E65100">Access token</text>

  <!-- Step 7: Access Resource Server -->
  <line x1="170" y1="265" x2="435" y2="245" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#oGreen)"/>
  <rect x="225" y="242" width="190" height="22" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <circle cx="237" cy="253" r="9" fill="#2E7D32"/>
  <text x="237" y="257" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">7</text>
  <text x="330" y="257" text-anchor="middle" font-size="10" fill="#2E7D32">API Request + Access Token</text>

  <!-- Key Box -->
  <rect x="630" y="80" width="155" height="200" rx="10" fill="#F5F5F5" stroke="#bbb" stroke-width="1"/>
  <text x="708" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Key Concepts</text>
  <line x1="640" y1="110" x2="775" y2="110" stroke="#ddd" stroke-width="1"/>
  <circle cx="650" cy="130" r="4" fill="#1565C0"/>
  <text x="660" y="134" font-size="9" fill="#555">Auth Code: one-time use</text>
  <circle cx="650" cy="152" r="4" fill="#E65100"/>
  <text x="660" y="156" font-size="9" fill="#555">Access Token: short-lived</text>
  <circle cx="650" cy="174" r="4" fill="#2E7D32"/>
  <text x="660" y="178" font-size="9" fill="#555">Refresh Token: long-lived</text>
  <circle cx="650" cy="196" r="4" fill="#C62828"/>
  <text x="660" y="200" font-size="9" fill="#555">client_secret: never exposed</text>
  <circle cx="650" cy="218" r="4" fill="#7B1FA2"/>
  <text x="660" y="222" font-size="9" fill="#555">PKCE: for public clients</text>
  <circle cx="650" cy="240" r="4" fill="#333"/>
  <text x="660" y="244" font-size="9" fill="#555">Scopes: limit access</text>
  <text x="660" y="270" font-size="8" fill="#999" font-style="italic">e.g., scope=email profile</text>

  <!-- Flow Summary -->
  <rect x="30" y="375" width="580" height="110" rx="10" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="320" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Why Authorization Code Flow?</text>
  <text x="50" y="420" font-size="11" fill="#555">1. User credentials are NEVER shared with the Client App</text>
  <text x="50" y="440" font-size="11" fill="#555">2. Auth code is exchanged server-side (back channel) - more secure</text>
  <text x="50" y="460" font-size="11" fill="#555">3. Client App gets limited access via scopes (principle of least privilege)</text>
  <text x="50" y="478" font-size="11" fill="#555">4. Tokens can be revoked without changing user's password</text>

  <!-- Security Badge -->
  <rect x="630" y="310" width="155" height="70" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="708" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">Security</text>
  <text x="708" y="355" text-anchor="middle" font-size="9" fill="#C62828">state param = CSRF protection</text>
  <text x="708" y="372" text-anchor="middle" font-size="9" fill="#C62828">PKCE = code interception guard</text>
</svg>