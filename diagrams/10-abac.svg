<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Attribute-Based Access Control (ABAC)</text>

  <defs>
    <marker id="abArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="abGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="abRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
  </defs>

  <!-- Central Policy Engine -->
  <rect x="290" y="115" width="220" height="80" rx="16" fill="#FFF3E0" stroke="#E65100" stroke-width="3"/>
  <text x="400" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">Policy Engine</text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#555">Evaluate attributes against rules</text>
  <text x="400" y="185" text-anchor="middle" font-size="9" fill="#888">XACML / OPA / Cedar</text>

  <!-- Subject Attributes (top-left) -->
  <rect x="40" y="50" width="180" height="95" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B1FA2">Subject Attributes</text>
  <line x1="55" y1="80" x2="205" y2="80" stroke="#E0D0F0" stroke-width="1"/>
  <text x="60" y="96" font-size="10" fill="#555">role: "doctor"</text>
  <text x="60" y="112" font-size="10" fill="#555">department: "cardiology"</text>
  <text x="60" y="128" font-size="10" fill="#555">clearance: "level-3"</text>
  <text x="60" y="140" font-size="10" fill="#555">location: "US"</text>

  <!-- Arrow from Subject to Engine -->
  <line x1="220" y1="110" x2="285" y2="140" stroke="#7B1FA2" stroke-width="2" marker-end="url(#abArrow)"/>

  <!-- Resource Attributes (top-right) -->
  <rect x="580" y="50" width="180" height="95" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="670" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Resource Attributes</text>
  <line x1="595" y1="80" x2="745" y2="80" stroke="#C8E6C9" stroke-width="1"/>
  <text x="595" y="96" font-size="10" fill="#555">type: "medical-record"</text>
  <text x="595" y="112" font-size="10" fill="#555">sensitivity: "high"</text>
  <text x="595" y="128" font-size="10" fill="#555">department: "cardiology"</text>
  <text x="595" y="140" font-size="10" fill="#555">owner: "patient-456"</text>

  <!-- Arrow from Resource to Engine -->
  <line x1="580" y1="110" x2="515" y2="140" stroke="#2E7D32" stroke-width="2" marker-end="url(#abArrow)"/>

  <!-- Action (bottom-left) -->
  <rect x="40" y="200" width="180" height="70" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="130" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Action</text>
  <line x1="55" y1="230" x2="205" y2="230" stroke="#BBDEFB" stroke-width="1"/>
  <text x="60" y="246" font-size="10" fill="#555">action: "read"</text>
  <text x="60" y="262" font-size="10" fill="#555">method: "GET /records/456"</text>

  <!-- Arrow from Action to Engine -->
  <line x1="220" y1="230" x2="285" y2="170" stroke="#1565C0" stroke-width="2" marker-end="url(#abArrow)"/>

  <!-- Environment (bottom-right) -->
  <rect x="580" y="200" width="180" height="70" rx="10" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
  <text x="670" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">Environment</text>
  <line x1="595" y1="230" x2="745" y2="230" stroke="#FFF176" stroke-width="1"/>
  <text x="595" y="246" font-size="10" fill="#555">time: "09:30 AM"</text>
  <text x="595" y="262" font-size="10" fill="#555">ip: "10.0.1.x" (internal)</text>

  <!-- Arrow from Environment to Engine -->
  <line x1="580" y1="230" x2="515" y2="170" stroke="#F57F17" stroke-width="2" marker-end="url(#abArrow)"/>

  <!-- Output: Allow/Deny -->
  <line x1="400" y1="195" x2="400" y2="250" stroke="#555" stroke-width="2.5" marker-end="url(#abArrow)"/>

  <!-- Decision Box -->
  <rect x="310" y="255" width="180" height="40" rx="12" fill="#FAFAFA" stroke="#555" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Decision</text>

  <!-- Allow -->
  <rect x="255" y="310" width="120" height="35" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
  <text x="315" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">ALLOW</text>
  <line x1="360" y1="295" x2="330" y2="310" stroke="#2E7D32" stroke-width="2" marker-end="url(#abGreen)"/>

  <!-- Deny -->
  <rect x="425" y="310" width="120" height="35" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/>
  <text x="485" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">DENY</text>
  <line x1="440" y1="295" x2="470" y2="310" stroke="#C62828" stroke-width="2" marker-end="url(#abRed)"/>

  <!-- Policy Rules Example -->
  <rect x="115" y="355" width="570" height="38" rx="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="130" y="372" font-size="10" font-weight="bold" fill="#555">Policy Rule:</text>
  <text x="215" y="372" font-size="10" fill="#333" font-family="Courier New, monospace">IF subject.dept == resource.dept</text>
  <text x="215" y="386" font-size="10" fill="#333" font-family="Courier New, monospace">AND time IN "08:00-18:00" AND action == "read" THEN ALLOW</text>
</svg>