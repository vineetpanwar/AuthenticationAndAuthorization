<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">API Key Authentication</text>

  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="aOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
  </defs>

  <!-- Phase 1: Key Registration -->
  <rect x="20" y="48" width="760" height="95" rx="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="68" font-size="12" font-weight="bold" fill="#888">PHASE 1: Key Registration</text>

  <!-- Developer Box -->
  <rect x="40" y="78" width="150" height="50" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="115" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Developer</text>

  <!-- API Provider -->
  <rect x="530" y="78" width="170" height="50" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="615" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">API Provider</text>

  <!-- Step 1 -->
  <line x1="190" y1="93" x2="525" y2="93" stroke="#1565C0" stroke-width="2" marker-end="url(#aBlue)"/>
  <circle cx="210" cy="93" r="9" fill="#1565C0"/>
  <text x="210" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
  <text x="358" y="88" text-anchor="middle" font-size="11" fill="#555">Request API Key</text>

  <!-- Step 2 -->
  <line x1="530" y1="118" x2="195" y2="118" stroke="#E65100" stroke-width="2" marker-end="url(#aOrange)"/>
  <circle cx="510" cy="118" r="9" fill="#E65100"/>
  <text x="510" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
  <text x="358" y="133" text-anchor="middle" font-size="11" fill="#555">Generate &amp; return API key</text>

  <!-- Phase 2: API Usage -->
  <rect x="20" y="155" width="760" height="120" rx="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="175" font-size="12" font-weight="bold" fill="#888">PHASE 2: API Usage</text>

  <!-- Client App -->
  <rect x="40" y="190" width="140" height="50" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="110" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Client App</text>

  <!-- API Gateway -->
  <rect x="330" y="185" width="160" height="60" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="410" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">API Gateway</text>
  <text x="410" y="230" text-anchor="middle" font-size="10" fill="#C62828">Rate Limiting</text>

  <!-- Backend Service -->
  <rect x="620" y="190" width="140" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="690" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Backend API</text>
  <text x="690" y="230" text-anchor="middle" font-size="10" fill="#555">Service</text>

  <!-- Step 3 -->
  <line x1="180" y1="208" x2="325" y2="208" stroke="#1565C0" stroke-width="2" marker-end="url(#aBlue)"/>
  <circle cx="195" cy="208" r="9" fill="#1565C0"/>
  <text x="195" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
  <text x="252" y="200" text-anchor="middle" font-size="9" fill="#555">Request +</text>
  <text x="252" y="212" text-anchor="middle" font-size="9" fill="#555" font-family="Courier New">X-API-Key</text>

  <!-- Step 4 internal -->
  <rect x="355" y="250" width="115" height="18" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
  <circle cx="367" cy="259" r="8" fill="#E65100"/>
  <text x="367" y="263" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">4</text>
  <text x="420" y="263" text-anchor="middle" font-size="9" fill="#E65100">Validate + limits</text>
  <line x1="410" y1="245" x2="410" y2="250" stroke="#E65100" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Step 5 -->
  <line x1="490" y1="215" x2="615" y2="215" stroke="#2E7D32" stroke-width="2" marker-end="url(#aGreen)"/>
  <circle cx="505" cy="215" r="9" fill="#2E7D32"/>
  <text x="505" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5</text>
  <text x="555" y="208" text-anchor="middle" font-size="10" fill="#555">Forward</text>

  <!-- Permission Tiers -->
  <rect x="100" y="295" width="600" height="90" rx="10" fill="#F5F5F5" stroke="#bbb" stroke-width="1.5"/>
  <text x="400" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">Permission Tiers</text>

  <!-- Free Tier -->
  <rect x="130" y="330" width="150" height="40" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="205" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Free</text>
  <text x="205" y="363" text-anchor="middle" font-size="10" fill="#555">100 req/day | Read</text>

  <!-- Pro Tier -->
  <rect x="320" y="330" width="150" height="40" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="395" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Pro</text>
  <text x="395" y="363" text-anchor="middle" font-size="10" fill="#555">10K req/day | R+W</text>

  <!-- Enterprise Tier -->
  <rect x="510" y="330" width="160" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="590" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Enterprise</text>
  <text x="590" y="363" text-anchor="middle" font-size="10" fill="#555">Unlimited | Full Access</text>
</svg>