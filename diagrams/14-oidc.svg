<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" font-family="Arial, sans-serif">
  <rect width="850" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">OpenID Connect (OIDC) Authorization Code Flow</text>

  <defs>
    <marker id="bBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="bOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <marker id="bGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="bPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7B1FA2"/>
    </marker>
  </defs>

  <!-- Actors -->
  <!-- User/Browser -->
  <rect x="30" y="55" width="120" height="55" rx="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="90" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B1FA2">User</text>
  <text x="90" y="97" text-anchor="middle" font-size="10" fill="#555">(Browser / App)</text>

  <!-- Relying Party (RP) -->
  <rect x="295" y="55" width="160" height="55" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="375" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Relying Party</text>
  <text x="375" y="95" text-anchor="middle" font-size="10" fill="#555">(Your App)</text>

  <!-- OpenID Provider (OP) -->
  <rect x="600" y="55" width="190" height="55" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="695" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">OpenID Provider</text>
  <text x="695" y="95" text-anchor="middle" font-size="10" fill="#555">(Google, Auth0, Okta)</text>

  <!-- Vertical lifelines -->
  <line x1="90" y1="110" x2="90" y2="490" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="375" y1="110" x2="375" y2="490" stroke="#1565C0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="695" y1="110" x2="695" y2="490" stroke="#E65100" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1 -->
  <line x1="100" y1="140" x2="363" y2="140" stroke="#7B1FA2" stroke-width="2" marker-end="url(#bBlue)"/>
  <text x="230" y="133" text-anchor="middle" font-size="11" fill="#333">1. Click "Login with Google"</text>

  <!-- Step 2 -->
  <line x1="363" y1="175" x2="102" y2="175" stroke="#1565C0" stroke-width="2" marker-end="url(#bPurple)"/>
  <text x="230" y="168" text-anchor="middle" font-size="11" fill="#333">2. 302 Redirect to /authorize</text>

  <!-- Step 3 -->
  <line x1="100" y1="210" x2="683" y2="210" stroke="#7B1FA2" stroke-width="2" marker-end="url(#bOrange)"/>
  <text x="400" y="203" text-anchor="middle" font-size="11" fill="#333">3. GET /authorize?client_id=...&amp;scope=openid+profile+email&amp;nonce=...</text>

  <!-- Step 4: User authenticates -->
  <rect x="635" y="230" width="120" height="30" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="695" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">4. User logs in</text>

  <!-- Step 5: OP redirects with code -->
  <line x1="683" y1="285" x2="102" y2="285" stroke="#E65100" stroke-width="2" marker-end="url(#bPurple)"/>
  <text x="400" y="278" text-anchor="middle" font-size="11" fill="#333">5. 302 Redirect to callback?code=abc123&amp;state=xyz</text>

  <!-- Step 6: Browser hits RP callback -->
  <line x1="100" y1="320" x2="363" y2="320" stroke="#7B1FA2" stroke-width="2" marker-end="url(#bBlue)"/>
  <text x="230" y="313" text-anchor="middle" font-size="11" fill="#333">6. GET /callback?code=abc123</text>

  <!-- Step 7: RP exchanges code for tokens (back-channel) -->
  <line x1="387" y1="355" x2="683" y2="355" stroke="#1565C0" stroke-width="2.5" marker-end="url(#bOrange)"/>
  <rect x="430" y="337" width="200" height="22" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
  <text x="530" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">7. POST /token (code + client_secret)</text>
  <text x="530" y="372" text-anchor="middle" font-size="9" fill="#888">Back-channel (server-to-server)</text>

  <!-- Step 8: OP returns tokens -->
  <line x1="683" y1="395" x2="387" y2="395" stroke="#E65100" stroke-width="2.5" marker-end="url(#bBlue)"/>
  <rect x="420" y="382" width="220" height="18" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
  <text x="530" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">8. ID Token (JWT) + Access Token</text>

  <!-- Step 9: RP validates ID Token -->
  <rect x="305" y="420" width="140" height="25" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="375" y="437" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">9. Validate ID Token</text>

  <!-- Step 10: Access granted -->
  <line x1="363" y1="465" x2="102" y2="465" stroke="#2E7D32" stroke-width="2" marker-end="url(#bGreen)"/>
  <text x="230" y="458" text-anchor="middle" font-size="11" fill="#2E7D32">10. Logged in! Session created</text>

  <!-- Key callout -->
  <rect x="30" y="500" width="790" height="50" rx="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="518" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Key: OIDC = OAuth 2.0 + ID Token (JWT). The ID Token proves WHO the user is. The Access Token grants API access.</text>
  <text x="425" y="538" text-anchor="middle" font-size="10" fill="#888">ID Token contains: iss (issuer), sub (user ID), aud (client), exp, iat, nonce, email, name — all in a signed JWT</text>
</svg>