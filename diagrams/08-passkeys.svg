<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Passkeys / WebAuthn Flow</text>

  <defs>
    <marker id="pBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="pGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="pOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <marker id="pRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
  </defs>

  <!-- REGISTRATION Phase -->
  <rect x="20" y="45" width="760" height="130" rx="10" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">REGISTRATION (One-time Setup)</text>

  <!-- Browser -->
  <rect x="40" y="80" width="130" height="50" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="105" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Browser</text>

  <!-- Relying Party -->
  <rect x="310" y="80" width="160" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Relying Party</text>
  <text x="390" y="120" text-anchor="middle" font-size="9" fill="#555">(Server)</text>

  <!-- Authenticator -->
  <rect x="600" y="80" width="160" height="50" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="680" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Authenticator</text>
  <text x="680" y="120" text-anchor="middle" font-size="9" fill="#555">Face ID / Fingerprint</text>

  <!-- Registration arrows -->
  <line x1="170" y1="95" x2="305" y2="95" stroke="#1565C0" stroke-width="1.5" marker-end="url(#pGreen)"/>
  <text x="238" y="90" text-anchor="middle" font-size="9" fill="#555">Register request</text>

  <line x1="310" y1="115" x2="175" y2="115" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#pBlue)"/>
  <text x="238" y="130" text-anchor="middle" font-size="9" fill="#555">Challenge + options</text>

  <line x1="170" y1="105" x2="595" y2="95" stroke="#1565C0" stroke-width="1.5" marker-end="url(#pOrange)" stroke-dasharray="5,3"/>
  <text x="400" y="80" text-anchor="middle" font-size="9" fill="#E65100">Prompt user verification</text>

  <!-- Key Pair Box -->
  <rect x="40" y="140" width="340" height="28" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <rect x="43" y="143" width="165" height="22" rx="4" fill="#FFCDD2"/>
  <text x="125" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Private Key (on device)</text>
  <rect x="215" y="143" width="162" height="22" rx="4" fill="#C8E6C9"/>
  <text x="296" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Public Key (to server)</text>

  <line x1="377" y1="153" x2="470" y2="118" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#pGreen)" stroke-dasharray="4,2"/>
  <text x="440" y="145" text-anchor="middle" font-size="8" fill="#2E7D32">stored server-side</text>

  <!-- AUTHENTICATION Phase -->
  <rect x="20" y="185" width="760" height="120" rx="10" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">AUTHENTICATION (Login)</text>

  <!-- Browser 2 -->
  <rect x="40" y="215" width="130" height="45" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="105" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Browser</text>

  <!-- Server 2 -->
  <rect x="310" y="215" width="160" height="45" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="390" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Server</text>

  <!-- Authenticator 2 -->
  <rect x="600" y="215" width="160" height="45" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="680" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Authenticator</text>

  <!-- Auth flow -->
  <line x1="170" y1="228" x2="305" y2="228" stroke="#1565C0" stroke-width="1.5" marker-end="url(#pGreen)"/>
  <circle cx="182" cy="228" r="8" fill="#1565C0"/>
  <text x="182" y="232" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">1</text>
  <text x="238" y="222" text-anchor="middle" font-size="9" fill="#555">Login request</text>

  <line x1="310" y1="248" x2="175" y2="248" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#pBlue)"/>
  <circle cx="295" cy="248" r="8" fill="#2E7D32"/>
  <text x="295" y="252" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">2</text>
  <text x="238" y="264" text-anchor="middle" font-size="9" fill="#555">Random challenge</text>

  <line x1="170" y1="238" x2="595" y2="230" stroke="#E65100" stroke-width="1.5" marker-end="url(#pOrange)"/>
  <circle cx="383" y1="234" cy="230" r="8" fill="#E65100"/>
  <text x="383" y="234" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">3</text>
  <text x="450" y="220" text-anchor="middle" font-size="9" fill="#E65100">Sign challenge with private key</text>

  <line x1="470" y1="260" x2="390" y2="260" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="450" y="275" text-anchor="middle" font-size="8" fill="#555">Verify with public key</text>

  <!-- Step indicators continued in auth flow -->
  <rect x="270" y="273" width="240" height="22" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <circle cx="282" cy="284" r="8" fill="#2E7D32"/>
  <text x="282" y="288" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">4</text>
  <text x="398" y="288" text-anchor="middle" font-size="9" fill="#2E7D32">Signature verified - Authenticated!</text>

  <!-- Phishing Resistance Box -->
  <rect x="30" y="315" width="360" height="75" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="210" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">Phishing Resistance</text>
  <text x="210" y="358" text-anchor="middle" font-size="10" fill="#555">Passkey is bound to the origin (domain)</text>
  <text x="210" y="375" text-anchor="middle" font-size="10" fill="#555">evil-site.com cannot use credentials for bank.com</text>
  <text x="210" y="385" text-anchor="middle" font-size="8" fill="#C62828">Private key NEVER leaves the device</text>

  <!-- Benefits Box -->
  <rect x="410" y="315" width="370" height="75" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="595" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Benefits over Passwords</text>
  <text x="435" y="356" font-size="10" fill="#555">&#10004; No passwords to remember or steal</text>
  <text x="435" y="372" font-size="10" fill="#555">&#10004; Resistant to phishing &amp; replay attacks</text>
  <text x="435" y="388" font-size="10" fill="#555">&#10004; Synced across devices via cloud providers</text>
</svg>