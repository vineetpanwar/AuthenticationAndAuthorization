<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Basic Authentication Flow</text>

  <!-- Client Box -->
  <rect x="50" y="120" width="180" height="80" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">Client</text>
  <text x="140" y="175" text-anchor="middle" font-size="11" fill="#555">(Browser / App)</text>

  <!-- Server Box -->
  <rect x="530" y="120" width="200" height="80" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="630" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">Server</text>
  <text x="630" y="175" text-anchor="middle" font-size="11" fill="#555">(Credential Store)</text>

  <!-- Arrow 1: Client to Server -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
  </defs>

  <line x1="230" y1="140" x2="525" y2="140" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow1)"/>
  <rect x="270" y="105" width="220" height="28" rx="5" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <circle cx="285" cy="119" r="10" fill="#1565C0"/>
  <text x="285" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
  <text x="380" y="123" text-anchor="middle" font-size="11" fill="#555">Request with Base64(user:pass)</text>

  <!-- Internal: Decode &amp; Verify -->
  <rect x="560" y="215" width="150" height="35" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="575" cy="232" r="10" fill="#E65100"/>
  <text x="575" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
  <text x="645" y="237" text-anchor="middle" font-size="10" fill="#E65100">Decode &amp; Verify</text>
  <line x1="630" y1="200" x2="630" y2="212" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Arrow 3: Server to Client -->
  <line x1="530" y1="180" x2="235" y2="180" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="290" y="183" width="190" height="28" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <circle cx="305" cy="197" r="10" fill="#2E7D32"/>
  <text x="305" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <text x="395" y="201" text-anchor="middle" font-size="11" fill="#555">200 OK / 401 Unauthorized</text>

  <!-- Header Example Box -->
  <rect x="140" y="285" width="500" height="70" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="390" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B1FA2">HTTP Header Example</text>
  <text x="390" y="335" text-anchor="middle" font-size="13" fill="#333" font-family="Courier New, monospace">Authorization: Basic dXNlcjpwYXNz</text>
  <text x="390" y="348" text-anchor="middle" font-size="10" fill="#888">Base64("user:pass") = dXNlcjpwYXNz</text>

  <!-- Warning -->
  <rect x="50" y="370" width="700" height="22" rx="5" fill="#FFEBEE"/>
  <text x="400" y="385" text-anchor="middle" font-size="11" fill="#C62828">&#9888; Credentials sent with every request - Always use HTTPS!</text>
</svg>