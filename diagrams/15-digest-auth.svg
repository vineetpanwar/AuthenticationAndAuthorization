<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" font-family="Arial, sans-serif">
  <rect width="850" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Digest Authentication Flow</text>

  <defs>
    <marker id="dBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="dOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <marker id="dGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="dRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="60" y="55" width="140" height="55" rx="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="130" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B1FA2">Client</text>
  <text x="130" y="97" text-anchor="middle" font-size="10" fill="#555">(Browser / curl)</text>

  <rect x="580" y="55" width="180" height="55" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="670" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Server</text>
  <text x="670" y="97" text-anchor="middle" font-size="10" fill="#555">(Stores HA1 hashes)</text>

  <!-- Lifelines -->
  <line x1="130" y1="110" x2="130" y2="460" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="670" y1="110" x2="670" y2="460" stroke="#1565C0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: Client requests resource -->
  <line x1="142" y1="140" x2="658" y2="140" stroke="#7B1FA2" stroke-width="2" marker-end="url(#dBlue)"/>
  <text x="400" y="133" text-anchor="middle" font-size="11" fill="#333">1. GET /protected (no credentials)</text>

  <!-- Step 2: Server sends 401 + challenge -->
  <line x1="658" y1="180" x2="142" y2="180" stroke="#C62828" stroke-width="2" marker-end="url(#dRed)"/>
  <text x="400" y="173" text-anchor="middle" font-size="11" fill="#C62828">2. 401 Unauthorized</text>

  <!-- Challenge details box -->
  <rect x="260" y="190" width="280" height="50" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="400" y="207" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">WWW-Authenticate: Digest</text>
  <text x="400" y="222" text-anchor="middle" font-size="9" fill="#555">realm="example.com", nonce="dcd98b..."</text>
  <text x="400" y="234" text-anchor="middle" font-size="9" fill="#555">qop="auth", algorithm=MD5</text>

  <!-- Step 3: Client computes hash -->
  <rect x="20" y="255" width="220" height="75" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="130" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">3. Client computes digest</text>
  <text x="130" y="288" text-anchor="middle" font-size="9" fill="#555">HA1 = MD5(user:realm:password)</text>
  <text x="130" y="301" text-anchor="middle" font-size="9" fill="#555">HA2 = MD5(GET:/protected)</text>
  <text x="130" y="314" text-anchor="middle" font-size="9" fill="#555">response = MD5(HA1:nonce:nc:cnonce:qop:HA2)</text>

  <!-- Step 4: Client sends digest response -->
  <line x1="142" y1="350" x2="658" y2="350" stroke="#7B1FA2" stroke-width="2" marker-end="url(#dBlue)"/>
  <text x="400" y="343" text-anchor="middle" font-size="11" fill="#333">4. GET /protected + Authorization: Digest response="6629fae4..."</text>

  <!-- Step 5: Server validates -->
  <rect x="570" y="365" width="200" height="45" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="670" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">5. Server computes same hash</text>
  <text x="670" y="398" text-anchor="middle" font-size="9" fill="#555">using stored HA1, compares result</text>

  <!-- Step 6: Access granted -->
  <line x1="658" y1="430" x2="142" y2="430" stroke="#2E7D32" stroke-width="2" marker-end="url(#dGreen)"/>
  <text x="400" y="423" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">6. 200 OK (password was NEVER sent)</text>

  <!-- Key callout -->
  <rect x="30" y="465" width="790" height="45" rx="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Key: The password is NEVER transmitted. Only a hash (digest) proving the client knows the password.</text>
  <text x="425" y="500" text-anchor="middle" font-size="10" fill="#888">Nonce prevents replay attacks. Nonce count (nc) detects replayed requests. Client nonce (cnonce) prevents chosen-plaintext attacks.</text>
</svg>