<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Role-Based Access Control (RBAC)</text>

  <defs>
    <marker id="rbArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="rbInherit" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="none" stroke="#7B1FA2" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Column Headers -->
  <rect x="30" y="48" width="130" height="32" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="95" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">Users</text>

  <rect x="220" y="48" width="150" height="32" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="295" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Roles</text>

  <rect x="440" y="48" width="160" height="32" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="520" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Permissions</text>

  <rect x="660" y="48" width="120" height="32" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="720" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Resources</text>

  <!-- Admin Row -->
  <!-- User: Alice -->
  <rect x="40" y="100" width="110" height="38" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="95" y="124" text-anchor="middle" font-size="12" fill="#7B1FA2">Alice</text>

  <!-- Role: Admin -->
  <rect x="225" y="95" width="140" height="48" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="295" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Admin</text>
  <text x="295" y="135" text-anchor="middle" font-size="9" fill="#888">Full control</text>

  <!-- Permissions for Admin -->
  <rect x="445" y="95" width="150" height="48" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="520" y="113" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold">read, write, delete,</text>
  <text x="520" y="130" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold">manage users</text>

  <!-- Resources for Admin -->
  <rect x="662" y="95" width="116" height="48" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="720" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">All Resources</text>
  <text x="720" y="133" text-anchor="middle" font-size="9" fill="#555">System-wide</text>

  <!-- Arrows Admin -->
  <line x1="150" y1="119" x2="220" y2="119" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>
  <line x1="365" y1="119" x2="440" y2="119" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>
  <line x1="595" y1="119" x2="657" y2="119" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>

  <!-- Editor Row -->
  <!-- Users: Bob, Carol -->
  <rect x="40" y="170" width="110" height="38" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="95" y="194" text-anchor="middle" font-size="12" fill="#7B1FA2">Bob, Carol</text>

  <!-- Role: Editor -->
  <rect x="225" y="165" width="140" height="48" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="295" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Editor</text>
  <text x="295" y="205" text-anchor="middle" font-size="9" fill="#888">Content management</text>

  <!-- Permissions for Editor -->
  <rect x="445" y="170" width="150" height="38" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="520" y="194" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">read, write</text>

  <!-- Resources for Editor -->
  <rect x="662" y="170" width="116" height="38" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="720" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Content</text>

  <!-- Arrows Editor -->
  <line x1="150" y1="189" x2="220" y2="189" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>
  <line x1="365" y1="189" x2="440" y2="189" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>
  <line x1="595" y1="189" x2="657" y2="189" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>

  <!-- Viewer Row -->
  <!-- Users: Dave, Eve -->
  <rect x="40" y="235" width="110" height="38" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="95" y="259" text-anchor="middle" font-size="12" fill="#7B1FA2">Dave, Eve</text>

  <!-- Role: Viewer -->
  <rect x="225" y="230" width="140" height="48" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="295" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Viewer</text>
  <text x="295" y="270" text-anchor="middle" font-size="9" fill="#888">Read-only access</text>

  <!-- Permissions for Viewer -->
  <rect x="445" y="235" width="150" height="38" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="520" y="259" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">read</text>

  <!-- Resources for Viewer -->
  <rect x="662" y="235" width="116" height="38" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="720" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Content</text>

  <!-- Arrows Viewer -->
  <line x1="150" y1="254" x2="220" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>
  <line x1="365" y1="254" x2="440" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>
  <line x1="595" y1="254" x2="657" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#rbArrow)"/>

  <!-- Role Hierarchy / Inheritance -->
  <rect x="30" y="295" width="740" height="95" rx="10" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">Role Hierarchy (Inheritance)</text>

  <rect x="80" y="330" width="110" height="35" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="135" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Admin</text>

  <line x1="190" y1="347" x2="270" y2="347" stroke="#7B1FA2" stroke-width="2" marker-end="url(#rbInherit)"/>
  <text x="230" y="340" text-anchor="middle" font-size="8" fill="#7B1FA2">inherits</text>

  <rect x="275" y="330" width="110" height="35" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="330" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Editor</text>

  <line x1="385" y1="347" x2="465" y2="347" stroke="#7B1FA2" stroke-width="2" marker-end="url(#rbInherit)"/>
  <text x="425" y="340" text-anchor="middle" font-size="8" fill="#7B1FA2">inherits</text>

  <rect x="470" y="330" width="110" height="35" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="525" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Viewer</text>

  <!-- Note -->
  <text x="680" y="348" text-anchor="middle" font-size="9" fill="#888">Admin has all Editor</text>
  <text x="680" y="362" text-anchor="middle" font-size="9" fill="#888">and Viewer permissions</text>
  <text x="680" y="376" text-anchor="middle" font-size="9" fill="#888">+ its own extras</text>
</svg>